<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lumina One Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one thin bar; operator = top nav + open page with whitespace-separated sections; resident = 3-tab phone column. Few containers. */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --sunk:#F1F2EF; --line:#E9EAE7; --line-2:#D6D8D4;
  --fg:#0F1317; --fg-2:#5A626A; --fg-3:#949BA2;
  --accent:#0E6B66; --accent-soft:#E4F0EE;
  --brass:#946C22; --bad:#C0362C; --warn:#B26B00; --ok:#1E7F4F; --info:#3A62A8;
  --card:#0E1319; --card-fg:#F2F4F5; --card-fg-2:#8C98A3; --card-line:#252F3A;
  --chart-1:#0E6B66; --chart-2:#C9CFCB; --grid:#EFF0ED; --scrim:rgba(15,19,23,.36);
  --f:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0D11; --surface:#11161C; --sunk:#171D24; --line:#1C232B; --line-2:#2A333D;
  --fg:#EDF0F2; --fg-2:#9AA4AD; --fg-3:#636D77;
  --accent:#43B7AC; --accent-soft:#11302E;
  --brass:#D6AE66; --bad:#F07A6E; --warn:#E4A646; --ok:#52C58E; --info:#8AAEEA;
  --card:#161D25; --card-fg:#F2F4F5; --card-fg-2:#8C98A3; --card-line:#2A3542;
  --chart-1:#43B7AC; --chart-2:#2E3843; --grid:#161C23; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0D11; --surface:#11161C; --sunk:#171D24; --line:#1C232B; --line-2:#2A333D;
  --fg:#EDF0F2; --fg-2:#9AA4AD; --fg-3:#636D77;
  --accent:#43B7AC; --accent-soft:#11302E;
  --brass:#D6AE66; --bad:#F07A6E; --warn:#E4A646; --ok:#52C58E; --info:#8AAEEA;
  --card:#161D25; --card-fg:#F2F4F5; --card-fg-2:#8C98A3; --card-line:#2A3542;
  --chart-1:#43B7AC; --chart-2:#2E3843; --grid:#161C23; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.m2{color:var(--fg-2)} .m3{color:var(--fg-3)}
.pts{color:var(--brass);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface)}
.btn:hover{border-color:var(--fg-3)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.link{border:0;background:none;padding:0;height:auto;color:var(--fg-2)}
.btn.link:hover{color:var(--fg)}
.btn.lg{height:48px;font-size:15px;border-radius:12px;padding:0 20px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast[hidden],.ctip[hidden]{display:none}
.track{height:4px;background:var(--sunk);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;background:var(--fg)}
.track i.warn{background:var(--warn)} .track i.pts{background:var(--brass)}

/* bar */
.gbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:28px;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;white-space:nowrap}
.mark{width:24px;height:24px;border-radius:6px;background:var(--card);display:grid;place-items:center;flex:none}
.mark svg{width:15px;height:15px}
.topnav{display:flex;gap:4px;height:100%}
.topnav button{height:100%;padding:0 10px;color:var(--fg-2);font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.topnav button:hover{color:var(--fg)}
.topnav button[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
.gbar .sp{flex:1}
.switch{display:flex;background:var(--sunk);border-radius:8px;padding:3px}
.switch button{padding:4px 11px;border-radius:6px;font-size:13px;color:var(--fg-2);font-weight:500}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.demo{font-size:12px;color:var(--warn);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);position:relative;flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--fg)}
.iconbtn .badge{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.mnav{display:none}
@media (max-width:900px){
  .gbar{gap:14px;padding:0 16px} .gbar .topnav{display:none}
  .mnav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:56px;z-index:30;scrollbar-width:none;height:44px}
  .mnav button{padding:0 10px;color:var(--fg-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
  .mnav button[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
}
@media (max-width:420px){ .brand span{display:none} .demo{display:none} }

/* operator page */
.page{max-width:1120px;margin:0 auto;padding:36px 24px 80px;display:grid;gap:44px;align-content:start}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ph h1{font-size:28px}
.ph .when{color:var(--fg-3);font-size:14px;margin-left:12px;font-weight:400}
.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:-24px;overflow-x:auto;scrollbar-width:none}
.subtabs button{padding:10px 0;color:var(--fg-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px 40px}
.metric{display:grid;gap:2px;align-content:start;min-width:0}
.metric .v{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.metric .l{color:var(--fg-2);font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.metric .d{font-size:12.5px;color:var(--ok);font-variant-numeric:tabular-nums}
.metric .d.dn{color:var(--bad)}
.metric svg{margin-top:12px;display:block}
.metrics.sm .v{font-size:28px;letter-spacing:-.025em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:860px){ .two{grid-template-columns:1fr;gap:44px} .metric .v{font-size:38px} .page{padding:24px 16px 64px;gap:36px} .subtabs{margin-top:-16px} }
.sec{display:grid;gap:10px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .c{color:var(--fg-3);font-weight:400;margin-left:6px}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row b{font-weight:500}
.row .s{color:var(--fg-3);font-size:13px}
.row.done{opacity:.4}
.row.click:hover{background:linear-gradient(var(--sunk),var(--sunk)) no-repeat;background-size:calc(100% + 24px) 100%;background-position:center}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline;font-size:13.5px}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.ev .x{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.ev .x b{color:var(--fg);font-weight:500}
.ev .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .r.bad{color:var(--bad)}
.ev .you{font-size:11px;color:var(--accent);margin-left:6px;font-weight:500}
.ev.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){ .ev.new{animation:none} }
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:0 1 260px;min-width:160px}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-3)}
.search input{width:100%;height:34px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px 0 32px;font-size:13.5px}
.search input:focus{outline:none;border-color:var(--fg-3)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:99px;font-size:13px;color:var(--fg-2);font-weight:500;white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:500;color:var(--fg-3);font-size:12.5px;padding:8px 14px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px 12px 0;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.t th:last-child,.t td:last-child{padding-right:0}
.t .r{text-align:right}
.t th button{font-weight:500;color:inherit}
.t th button.on{color:var(--fg)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t .who{display:flex;align-items:center;gap:10px}
.t .sub{display:block;color:var(--fg-3);font-size:12.5px}
.logo{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.t tr.off td{color:var(--bad)}
@media (max-width:700px){ .hs{display:none} }
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--fg-3)}
.chart .end{font-family:var(--f);font-size:12px;fill:var(--fg);font-weight:600}
.chart .tip-line{stroke:var(--line-2)}
.ctip{position:absolute;background:var(--fg);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;pointer-events:none;min-width:130px;z-index:5;display:grid;gap:2px}
.ctip .h{font-weight:600}
.ctip > div:not(.h){display:flex;gap:6px;align-items:center}
.ctip i{width:8px;height:8px;border-radius:2px}
.ctip b{margin-left:auto;padding-left:12px;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0}
.kv dt,.kv dd{padding:12px 0;border-top:1px solid var(--line);margin:0}
.kv dt:first-of-type,.kv dd:first-of-type{border-top:0}
.kv dt{color:var(--fg-2)} .kv dd{text-align:right;font-weight:500}
.camp{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) minmax(90px,1.2fr);gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.camp:hover{background:linear-gradient(var(--sunk),var(--sunk)) no-repeat;background-size:calc(100% + 24px) 100%;background-position:center}
.camp b{font-weight:500;display:block}
.camp .n{font-size:15px}
.camp .lb{display:block;color:var(--fg-3);font-size:12px}
@media (max-width:760px){ .camp{grid-template-columns:1fr 1fr 1fr} .camp > :first-child{grid-column:1/-1} .camp > :last-child{grid-column:1/-1} }

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:61;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);border-left:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 8px}
.dh h2{font-size:20px}
.db{overflow:auto;padding:12px 24px 32px;display:grid;gap:28px;align-content:start}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* resident */
.res{display:grid;grid-template-columns:minmax(0,400px) minmax(0,320px);justify-content:center;gap:56px;padding:28px 16px 0}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;height:min(820px,calc(100vh - 84px));min-height:580px}
.mirror{align-self:start;position:sticky;top:84px;display:grid;gap:12px;padding-top:20px}
.mirror h3{font-size:13px;color:var(--fg-3);font-weight:500}
@media (max-width:860px){ .res{grid-template-columns:1fr;padding:0;gap:0} .mirror{display:none} .phone{border:0;border-radius:0;height:calc(100dvh - 56px);min-height:0} }
.scr{flex:1;min-height:0;overflow:auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:30px;scrollbar-width:thin}
.scr > *{flex-shrink:0}
.ah{display:flex;justify-content:space-between;align-items:center}
.ah h1{font-size:24px}
.onecard{background:var(--card);color:var(--card-fg);border-radius:20px;padding:20px;display:grid;gap:26px;text-align:left;width:100%}
.onecard .tp{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.onecard .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.onecard .ac{display:flex;align-items:center;gap:6px;color:#8FE0B4}
.onecard .ac::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.onecard .ac.fz{color:#9CC3F2}
.onecard .bal{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.onecard .bt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--card-fg-2)}
.onecard .bt button{color:#E2BE7C;font-weight:500;font-variant-numeric:tabular-nums;font-size:14px}
.onecard.fz{opacity:.7}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{height:48px;border-radius:12px;background:var(--sunk);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.qa button:first-child{background:var(--fg);color:var(--bg)}
.qa button:disabled{opacity:.4}
.li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--fg-2)}
.li b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--fg-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .r small{display:block;font-size:12px}
.li .logo{width:36px;height:36px;border-radius:10px;font-size:12px}
.hs2{display:grid;grid-auto-flow:column;grid-auto-columns:72%;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.offer{scroll-snap-align:start;border-radius:16px;padding:16px;display:grid;gap:18px;text-align:left;background:var(--sunk)}
.offer.dk{background:var(--card);color:var(--card-fg)}
.offer .k{font-size:13px;font-weight:600}
.offer.dk .k{color:#E2BE7C} .offer:not(.dk) .k{color:var(--accent)}
.offer b{font-size:16px;font-weight:600;display:block}
.offer .s{font-size:12.5px;opacity:.65}
.tapwrap{display:grid;justify-items:center;gap:14px;padding:6px 0}
.tap{width:104px;height:104px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--fg);transition:border-color .2s,color .2s}
.tap .ico{width:34px;height:34px;stroke-width:1.5}
.tap.go{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 8px color-mix(in srgb, var(--ok) 14%, transparent)}
@media (prefers-reduced-motion:no-preference){ .tap.go{transition:box-shadow .4s} }
.tapwrap b{font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--fg-3);font-weight:500;padding:4px 0}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.sheet-wrap{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;z-index:0}
.sheet{position:relative;z-index:1;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:grid;gap:20px}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line-2);justify-self:center}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:19px}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--line-2);padding-bottom:6px}
.amt:focus-within{border-color:var(--fg)}
.amt span{font-size:22px;color:var(--fg-3)}
.amt input{border:0;background:none;font-size:40px;font-weight:600;letter-spacing:-.03em;width:100%;padding:0;font-variant-numeric:tabular-nums}
.amt input:focus{outline:none}
.opts{display:grid;gap:4px;max-height:180px;overflow:auto}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-align:left}
.opt .logo{width:30px;height:30px;font-size:10.5px}
.opt[aria-pressed="true"]{background:var(--sunk)}
.done{display:grid;justify-items:center;text-align:center;gap:8px;padding:8px 0}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin-bottom:6px}
.done .ok .ico{width:26px;height:26px;stroke-width:2.2}
.done h2{font-size:24px}
.code{font-family:var(--mono);font-size:18px;letter-spacing:.14em;padding:14px;border-radius:12px;background:var(--sunk);width:100%;text-align:center}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{height:40px;border-radius:10px;background:var(--sunk);font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.toggle{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on{background:var(--info)} .toggle.on::after{transform:translateX(16px)}

.inp{width:100%;height:48px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 14px;font-size:15px}
.inp:focus{outline:none;border-color:var(--fg)}

  pay:{icon:"wallet", cls:"pay", grp:"payments"}, topup:{icon:"plus", cls:"pay", grp:"payments"},
  decline:{icon:"alert", cls:"bad", grp:"payments", exc:true}, access:{icon:"door", cls:"", grp:"access"},
  booking:{icon:"cal", cls:"", grp:"access"}, points:{icon:"star", cls:"pts", grp:"rewards"},
  redeem:{icon:"gift", cls:"pts", grp:"rewards"}, activate:{icon:"card", cls:"ok", grp:"cards"},
  suspend:{icon:"snow", cls:"warn", grp:"cards", exc:true}, fault:{icon:"car", cls:"bad", grp:"access", exc:true},
};
const activeRes = RESIDENTS.filter(r=>r.status==="Active" && r!==ME);
function makeEvent(t, forced){
  const r = pick(activeRes); const ten = pick(TENANTS);
  const roll = forced || (()=>{ const x=Math.random()*100; return x<34?"pay":x<62?"access":x<74?"points":x<80?"redeem":x<86?"topup":x<90?"booking":x<93?"activate":x<97?"decline":x<99?"suspend":"fault"; })();
  const amt = Math.round((5 + Math.random()*Math.random()*140)*10)/10;
  const e = {t, type:roll, who:r.name, unit:r.unit};
  switch(roll){
    case "pay": Object.assign(e,{title:`<b>${r.name}</b> paid at ${ten.name}`, meta:`${r.unit} · One Card wallet · ${ten.cat}`, right:fS(amt), amt, ten:ten.id, status:"Approved"}); break;
    case "points": { const m = ten.mult && ten.cat==="Dining" ? 3 : 1; const p = Math.round(amt*2*m); Object.assign(e,{title:`<b>+${fN(p)} points</b> to ${r.name}`, meta:`${ten.name} · ${m>1?"Weekend Dining Bonus 3×":"2 points per S$1"}`, right:`<span class="pts">+${fN(p)}</span>`}); break; }
    case "access": { const d = pick(DOORS); e.door=d; Object.assign(e,{title:`<b>${r.name}</b> entered ${d}`, meta:`${r.unit} · tapped One Card`, right:`<span class="faint">Granted</span>`}); break; }
    case "redeem": { const rw = pick(REWARDS); Object.assign(e,{title:`<b>${r.name}</b> redeemed ${rw.name}`, meta:`${r.unit} · ${rw.where}`, right:`<span class="pts">−${fN(rw.cost)}</span>`}); break; }
    case "topup": { const v = pick([20,50,50,100,100,200]); Object.assign(e,{title:`<b>${r.name}</b> topped up wallet`, meta:`${r.unit} · simulated funding source`, right:`+${fS(v)}`, amt:v, status:"Top-up"}); break; }
    case "booking": { const f = pick(["BBQ pavilion","Tennis court","Function room"]); Object.assign(e,{title:`<b>${r.name}</b> booked ${f}`, meta:`${r.unit} · ${pick(["Sat 3 Oct","Sun 4 Oct","Fri 2 Oct"])} · ${pick(["10:00","18:00","19:00"])}`, right:`<span class="faint">Confirmed</span>`}); break; }
    case "activate": { const nr = pick(RESIDENTS.filter(x=>x.status==="Pending")) || r; Object.assign(e,{who:nr.name, unit:nr.unit, title:`<b>${nr.name}</b> activated One Card`, meta:`${nr.unit} · New Resident Welcome applied`, right:`<span class="pill ok plain">New</span>`}); break; }
    case "decline": Object.assign(e,{title:`Payment declined at ${ten.name}`, meta:`${r.name} · ${pick(["insufficient wallet balance","terminal timeout","card frozen by resident"])}`, right:`<span style="color:var(--bad)">${fS(amt)}</span>`, amt, ten:ten.id, status:"Declined"}); break;
    case "suspend": Object.assign(e,{title:`Card temporarily suspended`, meta:`${r.name} · ${r.unit} · frozen from resident app`, right:`<span class="pill warn plain">Suspended</span>`}); break;
    case "fault": Object.assign(e,{title:`Carpark B2 exit reader not responding`, meta:`Exit routed to intercom · ticket open`, right:`<span class="pill bad plain">Fault</span>`}); break;
  }
  return e;
}
// seed ~70 minutes of history
(function seed(){
  let t = now().getTime() - 70*60*1000;
  const list = [];
  while (t < now().getTime()-5000){ t += 25000 + Math.random()*55000; list.push(makeEvent(new Date(t))); }
  // ensure a couple of exceptions are present
  list.splice(list.length-6, 0, makeEvent(new Date(now().getTime()-9*60000), "decline"));
  list.splice(list.length-14, 0, makeEvent(new Date(now().getTime()-31*60000), "fault"));
  list.sort((a,b)=>b.t-a.t); S.feed = list;
  // ledger seed
  const L = []; let lt = now().getTime();
  for (let i=0;i<46;i++){ lt -= 60000*(3+Math.random()*14); const x=Math.random(); L.push(makeEvent(new Date(lt), x<.82?"pay":x<.94?"topup":"decline")); }
  L.splice(5,0,Object.assign(makeEvent(new Date(now().getTime()-40*60000),"pay"),{status:"Refunded"}));
  S.ledger = L.map((e,i)=>({...e, ref:"TXN-"+(884120-i*7)}));
})();

function pushEvent(e){
  S.feed.unshift(e); if (S.feed.length>240) S.feed.pop();
  if (["pay","topup","decline"].includes(e.type)) { S.ledger.unshift({...e, ref:"TXN-"+(884121+Math.floor(Math.random()*900))}); if (S.ledger.length>120) S.ledger.pop(); }
  onFeed(e);
}
function tick(){
  if (!S.paused) pushEvent(makeEvent(now()));
  setTimeout(tick, 2400 + Math.random()*2600);
}
/* resident-app events flow into the same feed */
function emitMine(type, extra){
  const e = Object.assign({t:now(), type, who:ME.name, unit:ME.unit, mine:true}, extra);
  pushEvent(e);
}

/* ================= charts ================= */
function niceMax(v){ if (v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const CHARTS = {}; let chartId = 0;
function chart(spec){ const id = "ch"+(++chartId); CHARTS[id] = spec; return `<div class="chart" id="${id}" style="position:relative;height:${spec.h||200}px"></div>`; }
function drawCharts(){ for (const id in CHARTS){ const el = document.getElementById(id); if (!el){ delete CHARTS[id]; continue; } const s = CHARTS[id]; (s.type==="line"?drawLine:drawCols)(el, s); } }
function axis(W,H,pd,max,fmt){
  let g = ""; for (let i=0;i<=4;i++){ const v = max*i/4; const y = pd.t + (H-pd.t-pd.b)*(1-i/4);
    g += `<line x1="${pd.l}" x2="${W-pd.r}" y1="${y}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/><text x="${pd.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`; }
  return g;
}
function xlabels(labels, xf, H, pd, every){ const n = labels.length; return labels.map((l,i)=> (i===n-1 || (i%every===0 && n-1-i >= every*0.6)) ? `<text x="${xf(i)}" y="${H-6}" text-anchor="middle">${l}</text>` : "").join(""); }
function drawLine(el, s){
  const W = Math.max(280, el.clientWidth), H = s.h||200, pd = {l:44, r:s.endLabel===false?12:58, t:14, b:24};
  const all = s.series.flatMap(x=>x.values.filter(v=>v!=null)); const max = niceMax(Math.max(...all)*1.05);
  const n = s.labels.length; const xf = i => pd.l + i*(W-pd.l-pd.r)/(n-1); const yf = v => pd.t + (H-pd.t-pd.b)*(1-v/max);
  const fmt = s.fmt || fK; let g = axis(W,H,pd,max,fmt);
  const every = Math.ceil(n / Math.max(3, Math.floor((W-pd.l-pd.r)/64)));
  g += xlabels(s.labels, xf, H, pd, every);
  s.series.forEach((ser,si)=>{
    const pts = ser.values.map((v,i)=>[xf(i),yf(v)]);
    const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    if (si===0 && s.area!==false) g += `<path d="${d} L${xf(n-1)} ${yf(0)} L${xf(0)} ${yf(0)} Z" style="fill:${ser.color};opacity:.1"/>`;
    g += `<path d="${d}" fill="none" style="stroke:${ser.color}" stroke-width="${si===0?2:1.6}" ${ser.dash?'stroke-dasharray="4 4"':""} stroke-linejoin="round"/>`;
    const last = pts[n-1];
    g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" style="fill:${ser.color};stroke:var(--surface)" stroke-width="2"/>`;
    if (s.endLabel!==false) g += `<text class="end" x="${last[0]+8}" y="${last[1]+4}">${(s.endFmt||fmt)(ser.values[n-1])}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="tip-line" x1="0" x2="0" y1="${pd.t}" y2="${H-pd.b}" stroke-width="1" style="display:none"/></svg><div class="ctip" hidden></div>`;
  hover(el, s, xf, pd, W, n);
}
function drawCols(el, s){
  const W = Math.max(280, el.clientWidth), H = s.h||200, pd = {l:44, r:12, t:14, b:24};
  const n = s.labels.length; const stacked = s.mode!=="group";
  const tot = i => stacked ? s.series.reduce((a,x)=>a+(x.values[i]||0),0) : Math.max(...s.series.map(x=>x.values[i]||0));
  const max = niceMax(Math.max(...s.labels.map((_,i)=>Math.max(tot(i), s.ghost?(s.ghost[i]||0):0)))*1.05);
  const band = (W-pd.l-pd.r)/n; const bw = Math.min(34, band*0.62); const xf = i => pd.l + band*i + band/2;
  const yf = v => pd.t + (H-pd.t-pd.b)*(1-v/max); const fmt = s.fmt || fK;
  let g = axis(W,H,pd,max,fmt);
  const every = Math.ceil(n / Math.max(3, Math.floor((W-pd.l-pd.r)/48)));
  g += xlabels(s.labels, xf, H, pd, every);
  for (let i=0;i<n;i++){
    if (s.ghost && s.series.every(x=>x.values[i]==null)){ const v=s.ghost[i]; g += `<rect x="${xf(i)-bw/2}" y="${yf(v)}" width="${bw}" height="${yf(0)-yf(v)}" rx="2" style="fill:none;stroke:var(--line-strong)" stroke-dasharray="3 3"/>`; continue; }
    if (stacked){ let acc=0; s.series.forEach((ser)=>{ const v=ser.values[i]||0; if(!v) return; const y0=yf(acc), y1=yf(acc+v); g += `<rect x="${xf(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-1)}" style="fill:${ser.color}"/>`; acc+=v; }); }
    else { const k=s.series.length, w=bw/k; s.series.forEach((ser,si)=>{ const v=ser.values[i]||0; g += `<rect x="${xf(i)-bw/2+si*w}" y="${yf(v)}" width="${w-1.5}" height="${yf(0)-yf(v)}" style="fill:${ser.color}"/>`; }); }
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="tip-line" x1="0" x2="0" y1="${pd.t}" y2="${H-pd.b}" stroke-width="1" style="display:none"/></svg><div class="ctip" hidden></div>`;
  hover(el, s, xf, pd, W, n);
}
function hover(el, s, xf, pd, W, n){
  const svg = el.querySelector("svg"), tip = el.querySelector(".ctip"), ln = el.querySelector(".tip-line");
  const fmt = s.tipFmt || s.fmt || fN;
  el.onpointermove = ev => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
    let i = 0, best = 1e9; for (let k=0;k<n;k++){ const d=Math.abs(xf(k)-x); if (d<best){best=d;i=k;} }
    const rows = s.series.filter(x=>x.values[i]!=null).map(x=>`<div><i style="background:${x.color}"></i>${x.name}<b>${fmt(x.values[i])}</b></div>`).join("") || (s.ghost?`<div>${s.ghostName||"Comparison"}<b>${fmt(s.ghost[i])}</b></div>`:"");
    tip.innerHTML = `<div class="h">${s.tipLabels?s.tipLabels[i]:s.labels[i]}</div>${rows}`; tip.hidden = false;
    ln.setAttribute("x1", xf(i)); ln.setAttribute("x2", xf(i)); ln.style.display = "";
    const px = xf(i) * r.width / W; tip.style.left = Math.min(Math.max(0, px + 12), r.width - tip.offsetWidth) + "px"; tip.style.top = "4px";
    if (px + 12 + tip.offsetWidth > r.width) tip.style.left = Math.max(0, px - tip.offsetWidth - 12) + "px";
  };
  el.onpointerleave = () => { tip.hidden = true; ln.style.display = "none"; };
}
function spark(vals, w=84, h=24, color="var(--chart-1)"){
  const mx=Math.max(...vals), mn=Math.min(...vals); const xf=i=>i*(w-4)/(vals.length-1)+2, yf=v=>h-3-(v-mn)/(mx-mn||1)*(h-6);
  const d = vals.map((v,i)=>(i?"L":"M")+xf(i).toFixed(1)+" "+yf(v).toFixed(1)).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${color}" stroke-width="1.5"/><circle cx="${xf(vals.length-1)}" cy="${yf(vals[vals.length-1])}" r="2.2" style="fill:${color}"/></svg>`;
}

  const h = S.view==="resident" ? "app-"+S.app.tab : "op-"+S.op+(SUBS[S.op]?"-"+S.sub[S.op]:"");
  if (location.hash.slice(1)!==h) history.replaceState(null,"","#"+h);

function readHash(){
  const h = location.hash.slice(1).split("-");
  if (h[0]==="app"||h[0]==="resident"){ S.view="resident"; if (["home","nearby","card"].includes(h[1])) S.app.tab=h[1]; }
  else { S.view="operator"; if (NAV.some(n=>n[0]===h[1])) S.op=h[1]; if (h[2] && SUBS[S.op]?.some(s=>s[0]===h[2])) S.sub[S.op]=h[2]; }

const subtabs = k => `<nav class="subtabs" aria-label="${k}">${SUBS[k].map(([s,l])=>`<button data-act="sub" data-k="${s}" ${S.sub[k]===s?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`;

const sec = (h, body, right="", count="") => `<section class="sec"><div class="sec-h"><h2>${h}${count!==""?`<span class="c">${count}</span>`:""}</h2>${right}</div>${body}</section>`;

const STD = {Active:"ok",Approved:"ok",Live:"ok",Online:"ok",Normal:"ok",Pending:"info","Top-up":"info",Scheduled:"info",Suspended:"warn",Refunded:"warn",Degraded:"warn",Declined:"bad",Offline:"bad",Dormant:"",Ended:""};
const st = (s, label) => `<span class="st"><i class="dot ${STD[s]??""}"></i>${label||s}</span>`;

function ev(e, fresh){
  const r = String(e.right).replace(/<span class="pill[^"]*">([^<]*)<\/span>/, "$1").replace(/<span class="faint">([^<]*)<\/span>/, `<span class="m3">$1</span>`);
  return `<div class="ev ${fresh?"new":""}"><span class="t">${hhmm(e.t)}</span><span class="x">${e.title}${e.mine?`<span class="you">app</span>`:""}</span><span class="r ${EV_META[e.type].exc?"bad":""}">${r}</span></div>`;
}
function onFeed(e){
  const box = $("#feed"); if (box && !S.paused){ box.insertAdjacentHTML("afterbegin", ev(e,true)); while (box.children.length > +box.dataset.n) box.lastElementChild.remove(); }
  const full = $("#feedall"); if (full && (S.feedFilter==="all" || EV_META[e.type].grp===S.feedFilter || (S.feedFilter==="exceptions" && EV_META[e.type].exc))){ full.insertAdjacentHTML("afterbegin", ev(e,true)); }
  const m = $("#mirror"); if (m && e.mine) m.innerHTML = mirrorRows();
}

      <div id="ps">${payFoot()}</div>`; }
  } else if (s.kind==="topup"){
    b = s.step==="done" ? done("+"+fS(s.amt), "Wallet "+fS(ME.wallet)) : h("Top up") + `<div class="slots" style="grid-template-columns:repeat(4,1fr)">${[20,50,100,200].map(v=>`<button class="slot" data-act="topamt" data-v="${v}" aria-pressed="${s.amt===v}">S$${v}</button>`).join("")}</div><p class="m3" style="font-size:12.5px">Demo bank · no card details</p><button class="btn pri lg block" data-act="dotopup">Add ${fS(s.amt)}</button>`;
  } else if (s.kind==="merchant"){
    const t = TEN[s.id];
    b = h("") + `<div style="display:flex;gap:14px;align-items:center">${logo(t).replace('class="logo"','class="logo" style="width:52px;height:52px;border-radius:14px;font-size:17px;background:'+t.color+'"')}<div><h2 style="font-size:20px">${t.name}</h2><span class="m3">${t.cat} · ${t.unit} · ${t.walk} min</span></div></div>
      <dl class="kv">${[t.deal?["Offer",t.deal]:null,["Earn",`<span class="pts">${t.mult||"2 pts / S$1"}</span>`],["Open",t.hours]].filter(Boolean).map(([k,v])=>`<dt>${k}</dt><dd style="font-weight:400;text-align:right;max-width:60%;justify-self:end">${v}</dd>`).join("")}</dl>
      <button class="btn pri lg block" data-act="payhere" data-id="${t.id}" ${A.frozen?"disabled":""}>Pay here</button>`;
  } else if (s.kind==="rewards"){
    b = h(`${fN(ME.points)} pts`) + `<div class="rows">${[...REWARDS].sort((a,b)=>a.cost-b.cost).map(r=>{ const ok = ME.points>=r.cost; return `<div class="li" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${r.name}</b><span class="s pts">${fN(r.cost)} pts</span>${ok?"":`<div class="track" style="margin-top:6px"><i class="pts" style="width:${ME.points/r.cost*100}%"></i></div>`}</div>${ok?`<button class="btn" data-act="redeem" data-id="${r.id}">Redeem</button>`:`<span class="m3" style="font-size:12.5px">${fN(r.cost-ME.points)} more</span>`}</div>`; }).join("")}</div>`;
  } else if (s.kind==="redeem"){
    const r = REWARDS.find(x=>x.id===s.id);
    b = s.step==="done" ? done(r.name, "", `<div class="code">${s.code}</div><span class="pts">${fN(ME.points)} pts left</span>`) : h("Redeem") + `<div><b style="font-size:17px;font-weight:600">${r.name}</b><p class="m3">${r.where}</p></div><button class="btn pri lg block" data-act="doredeem" data-id="${r.id}">Use ${fN(r.cost)} pts</button>`;
  } else if (s.kind==="book"){
    const taken = new Set([(s.day*7+1)%6,(s.day*3+4)%6]);
    b = s.step==="done" ? done(FAC.find(f=>f[0]===s.id)[1], s.when) : h("Book") +
      `<div class="chips">${FAC.map(f=>`<button class="chip" data-act="bfac" data-k="${f[0]}" aria-pressed="${s.id===f[0]}">${f[1]}</button>`).join("")}</div>
      <div class="chips">${DAYS.map(d=>`<button class="chip" data-act="bday" data-k="${d.k}" aria-pressed="${s.day===d.k}">${d.s}</button>`).join("")}</div>
      <div class="slots">${SLOTS[s.id].map((t,i)=>`<button class="slot" data-act="bslot" data-k="${t}" aria-pressed="${s.slot===t}" ${taken.has(i)?"disabled":""}>${t}</button>`).join("")}</div>
      <button class="btn pri lg block" data-act="dobook" ${s.slot?"":"disabled"}>${s.slot?"Book "+DAYS[s.day].s+", "+s.slot:"Pick a time"}</button>`;
  } else if (s.kind==="notif"){
    b = h("Notifications") + `<div class="rows">${li(ico("parcel"),"Parcel at concierge","Tower B · collect by Thu")}${li(ico("alert"),"Pool closed Thu","9am – 12pm")}${li(ico("info"),"Fire alarm test","Wed 30 Sep · 10am")}</div>`;
  }
  return `<div class="sheet-wrap"><div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true">${b}</div></div>`;
}
function payFoot(){
  const s = A.sheet; const amt = parseFloat(s.amt); const ok = amt>0 && isFinite(amt); const over = ok && amt>ME.wallet; const e = ok ? earn(s.m, amt) : null;
  return `<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:14px"><span class="${over?"":"m3"}" ${over?'style="color:var(--bad)"':""}>${over?"Over balance · top up first":"Balance "+fS(ME.wallet)}</span><span class="pts">${e?"+"+fN(e.pts)+" pts":""}</span></div>
  <button class="btn pri lg block" data-act="dopay" ${ok&&!over?"":"disabled"}>${ok?"Pay "+fS(amt):"Pay"}</button>`;
}
function rerenderApp(keep=true){ const sc=$("#scr"); const top = sc?sc.scrollTop:0; $("#phone").innerHTML = A.logged?app():login(); if (keep && $("#scr")) $("#scr").scrollTop = top; }

/* ================= interaction ================= */
const H = {
  go(el){ S.view = el.dataset.v; S.drawer=null; setHash(); render(); window.scrollTo(0,0); },
  theme(){ document.documentElement.dataset.theme = isDark()?"light":"dark"; render(); },
  op(el){ S.op = el.dataset.p; S.drawer=null; setHash(); render(); window.scrollTo(0,0); },
  sub(el){ S.sub[S.op] = el.dataset.k; setHash(); render(); },
  period(el){ S.period = el.dataset.k; render(); },
  handle(el){ const a = S.attention.find(x=>x.id===el.dataset.id); a.done = true; toast(a.a+" · done"); render(); },
  toast(el){ toast(el.dataset.m); },
  drawer(el){ S.drawer = [el.dataset.k, el.dataset.id]; render(); },
  close(){ S.drawer = null; render(); },
  ffilter(el){ S.feedFilter = el.dataset.k; render(); },
  rfilter(el){ S.resFilter = el.dataset.k; render(); },
  lfilter(el){ S.ledFilter = el.dataset.k; render(); },
  tsort(el){ const k = el.dataset.k; S.tenSort = [k, S.tenSort[0]===k ? -S.tenSort[1] : (k==="name"?1:-1)]; $("#ttable").innerHTML = tenTable(); },
  suspend(el){ const r = RESIDENTS.find(x=>x.id===el.dataset.id); r.status="Suspended"; if (r===ME) A.frozen=true; pushEvent({t:now(), type:"suspend", who:r.name, unit:r.unit, title:`<b>${r.name}</b> card suspended`, meta:"", right:"Suspended"}); toast("Card suspended"); render(); },
  reinstate(el){ const r = RESIDENTS.find(x=>x.id===el.dataset.id); r.status="Active"; if (r===ME) A.frozen=false; toast("Card reinstated"); render(); },
  // resident
  tab(el){ A.tab = el.dataset.k; A.sheet=null; setHash(); rerenderApp(false); },
  access(){ A.tab = "card"; setHash(); rerenderApp(false); $("#access")?.scrollIntoView({block:"start"}); },
  sheet(el){ const k = el.dataset.k;
    A.sheet = k==="pay" ? {kind:"pay", m:"kopi", amt:""} : k==="topup" ? {kind:"topup", amt:50} : k==="book" ? {kind:"book", id:el.dataset.id||"bbq", day:0, slot:null} : {kind:k, id:el.dataset.id};
    rerenderApp(); if (k==="pay") setTimeout(()=>$("#pa")?.focus(), 30); },
  closesheet(){ A.sheet=null; rerenderApp(); },
  pickm(el){ A.sheet.m = el.dataset.id; rerenderApp(); },
  payhere(el){ A.sheet = {kind:"pay", m:el.dataset.id, amt:""}; rerenderApp(); setTimeout(()=>$("#pa")?.focus(), 30); },
  dopay(){ const s = A.sheet; const amt = Math.round(parseFloat(s.amt)*100)/100; const t = TEN[s.m]; const e = earn(s.m, amt);
    ME.wallet = Math.round((ME.wallet-amt)*100)/100; ME.points += e.pts; ME.spend += amt; ME.visits++; t.txn++; t.sales += amt; ME.lastWhen = "Just now";
    myTx.unshift({m:s.m, amt:-amt, pts:e.pts, when:"Today", time:hhmm(now())});
    emitMine("pay", {title:`<b>${ME.name}</b> paid ${t.name}`, meta:"", right:fS(amt), amt, ten:t.id, status:"Approved"});
    setTimeout(()=>emitMine("points", {title:`<b>${ME.name}</b> +${fN(e.pts)} pts`, meta:"", right:`<span class="pts">+${fN(e.pts)}</span>`}), 600);
    Object.assign(s, {step:"done", paid:amt, earned:e.pts}); rerenderApp(); },
  topamt(el){ A.sheet.amt = +el.dataset.v; rerenderApp(); },
  dotopup(){ const v = A.sheet.amt; ME.wallet += v; myTx.unshift({topup:true, amt:v, when:"Today", time:hhmm(now())}); emitMine("topup", {title:`<b>${ME.name}</b> topped up`, meta:"", right:"+"+fS(v), amt:v, status:"Top-up"}); A.sheet.step="done"; rerenderApp(); },
  redeem(el){ A.sheet = {kind:"redeem", id:el.dataset.id}; rerenderApp(); },
  doredeem(el){ const r = REWARDS.find(x=>x.id===el.dataset.id); ME.points -= r.cost; r.redeemed++; const code = "LSQ-"+Math.random().toString(36).slice(2,5).toUpperCase()+"-"+Math.random().toString(36).slice(2,5).toUpperCase();
    myTx.unshift({redeem:true, name:r.name, pts:r.cost, when:"Today", time:hhmm(now())}); emitMine("redeem", {title:`<b>${ME.name}</b> redeemed ${r.name}`, meta:"", right:`<span class="pts">−${fN(r.cost)}</span>`}); Object.assign(A.sheet, {step:"done", code}); rerenderApp(); },
  bfac(el){ Object.assign(A.sheet, {id:el.dataset.k, slot:null}); rerenderApp(); },
  bday(el){ Object.assign(A.sheet, {day:+el.dataset.k, slot:null}); rerenderApp(); },
  bslot(el){ A.sheet.slot = el.dataset.k; rerenderApp(); },
  dobook(){ const s = A.sheet; const f = FAC.find(x=>x[0]===s.id)[1]; const when = `${DAYS[s.day].l} · ${s.slot}`; A.bookings.unshift({fac:f, when}); emitMine("booking", {title:`<b>${ME.name}</b> booked ${f}`, meta:"", right:`<span class="faint">${DAYS[s.day].s}</span>`}); Object.assign(s, {step:"done", when}); rerenderApp(); },
  door(el){ A.door = el.dataset.k; A.tapping=false; rerenderApp(); },
  tap(){ if (A.frozen){ toast("Card is frozen"); return; } if (A.tapping) return; A.tapping = true; rerenderApp();
    emitMine("access", {title:`<b>${ME.name}</b> · ${A.door}`, meta:"", right:`<span class="faint">Entry</span>`});
    setTimeout(()=>{ A.tapping=false; if (S.view==="resident"&&A.tab==="card") rerenderApp(); }, 2200); },
  freeze(){ A.frozen = !A.frozen; ME.status = A.frozen?"Suspended":"Active";
    emitMine(A.frozen?"suspend":"activate", {title:`<b>${ME.name}</b> ${A.frozen?"froze":"unfroze"} card`, meta:"", right:A.frozen?"Frozen":"Active"}); rerenderApp(); },
  alltx(){ A.allTx = true; rerenderApp(); },
  logout(){ A.logged=false; A.sheet=null; A.tab="home"; rerenderApp(false); },
  ncat(el){ A.cat = el.dataset.k; rerenderApp(); },
};
function doLogin(){
  const id = ($("#lg-id")?.value||"").trim();
  const um = id.toUpperCase().replace(/\s/g,"").match(/^#?([ABC])-?(\d{1,2})-(\d{1,2})$/);
  if (um){ ME.tower=um[1]; ME.unit=`${um[1]}-${pad2(um[2])}-${pad2(um[3])}`; }
  else if (id.includes("@") && id.toLowerCase()!=="meilin.tan@example.com"){ const n = id.split("@")[0].split(/[._-]/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()); if (n.length){ ME.first=n[0]; ME.name=n.join(" "); } }
  A.logged = true; A.tab="home"; setHash(); rerenderApp(false);
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = H[el.dataset.act]; if (f){ e.preventDefault(); f(el, e); } });
document.addEventListener("keydown", e => { if (e.key==="Escape"){ if (A.sheet){ A.sheet=null; rerenderApp(); } else if (S.drawer){ S.drawer=null; render(); } } if (e.key==="Enter" && e.target.matches("tr[data-act]")) e.target.click(); });
document.addEventListener("submit", e => { if (e.target.id==="lf"){ e.preventDefault(); doLogin(); } });
document.addEventListener("input", e => {
  const k = e.target.dataset.input; if (!k) return; const v = e.target.value;
  if (k==="resq"){ S.resQuery=v; $("#rtable").innerHTML = resTable(); }
  else if (k==="tenq"){ S.tenQuery=v; $("#ttable").innerHTML = tenTable(); }
  else if (k==="payamt"){ A.sheet.amt = v.replace(/[^\d.]/g,""); $("#ps").innerHTML = payFoot(); }
  else if (k==="nearq"){ A.q=v; const p = e.target.selectionStart; rerenderApp(); const i=$("#nq"); if(i){ i.focus(); i.setSelectionRange(p,p); } }
});
window.addEventListener("hashchange", ()=>{ S.drawer=null; readHash(); render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if (!document.documentElement.dataset.theme) render(); });
readHash(); render(); setTimeout(tick, 2000);
</script>
</body>
