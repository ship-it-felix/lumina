<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Concept prototype of SEAPORT Loyalty / Lumina One Card. All data is fictional and simulated.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lumina One Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one global bar; three surfaces — intro (the loop), operator console (sidebar + dense grid), resident app (430px phone column + operator mirror). */
:root{
  --ink:#0B1119;
  --bg:#F2F3F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --sunk:#ECEEEB;
  --line:#E0E3E0; --line-strong:#C9CECB;
  --fg:#121820; --fg-2:#46515C; --fg-3:#78838E;
  --accent:#0E6B66; --accent-2:#0A5551; --accent-soft:#E2EFED; --on-accent:#FFFFFF;
  --brass:#8F6A26; --brass-soft:#F3EBDB; --brass-line:#D9C39A;
  --ok:#1B7A47; --ok-soft:#E2F1E8;
  --warn:#A06300; --warn-soft:#FAEFD8;
  --bad:#B42318; --bad-soft:#FAE6E3;
  --info:#2D5DA6; --info-soft:#E5ECF7;
  --card-bg:#0B1119; --card-fg:#EEF2F4; --card-fg-2:#94A2AF; --card-line:#243242;
  --chart-1:#0E6B66; --chart-2:#B8924E; --chart-3:#8FA3B3; --grid:#E6E8E5;
  --scrim:rgba(11,17,25,.42);
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0F16; --surface:#111923; --surface-2:#0E151E; --sunk:#0B1119;
  --line:#1F2B38; --line-strong:#2C3B4B;
  --fg:#E6EBEE; --fg-2:#A3AFBA; --fg-3:#6E7B88;
  --accent:#3DB2A7; --accent-2:#5CC6BC; --accent-soft:#10302E; --on-accent:#06201E;
  --brass:#D4AA62; --brass-soft:#2A2315; --brass-line:#5A4a2A;
  --ok:#4CC38A; --ok-soft:#10281C; --warn:#E3A640; --warn-soft:#2C2311; --bad:#F2766B; --bad-soft:#321715; --info:#86ABEA; --info-soft:#15223A;
  --card-bg:#17212D; --card-fg:#EEF2F4; --card-fg-2:#94A2AF; --card-line:#2A394A;
  --chart-1:#3DB2A7; --chart-2:#D4AA62; --chart-3:#5D6F80; --grid:#1B2632;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0F16; --surface:#111923; --surface-2:#0E151E; --sunk:#0B1119;
  --line:#1F2B38; --line-strong:#2C3B4B;
  --fg:#E6EBEE; --fg-2:#A3AFBA; --fg-3:#6E7B88;
  --accent:#3DB2A7; --accent-2:#5CC6BC; --accent-soft:#10302E; --on-accent:#06201E;
  --brass:#D4AA62; --brass-soft:#2A2315; --brass-line:#5A4a2A;
  --ok:#4CC38A; --ok-soft:#10281C; --warn:#E3A640; --warn-soft:#2C2311; --bad:#F2766B; --bad-soft:#321715; --info:#86ABEA; --info-soft:#15223A;
  --card-bg:#17212D; --card-fg:#EEF2F4; --card-fg-2:#94A2AF; --card-line:#2A394A;
  --chart-1:#3DB2A7; --chart-2:#D4AA62; --chart-3:#5D6F80; --grid:#1B2632;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- global bar ---------- */
.gbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;height:54px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);white-space:nowrap;background:none;border:0;padding:0}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--card-bg);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px}
.brand b{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;font-size:13px}
.brand span{font-size:12px;color:var(--fg-3)}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--fg-2);white-space:nowrap;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.gbar .spacer{flex:1}
.proto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.proto i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
@media (max-width:760px){ .brand span,.proto .long{display:none} .gbar{gap:10px} .seg button{padding:5px 9px} }
@media (max-width:480px){ .brand b{display:none} .gbar{gap:8px;padding:0 12px} .seg button{padding:5px 8px;font-size:12.5px} .proto .p-full{display:none} }
@media (min-width:481px){ .proto .p-short{display:none} }
.toast[hidden]{display:none}

/* ---------- shared components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.quiet{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.lg{padding:12px 18px;font-size:15px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)} .pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.plain::before{display:none}
.pts{color:var(--brass);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 0;flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:600}
.panel-h .sub{font-size:12px;color:var(--fg-3)}
.panel-b{padding:14px 16px 16px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--fg-2)}
.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;min-width:0}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3);width:16px;height:16px}
.search input{padding:7px 10px 7px 32px;font-size:13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.bar-track{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
.bar-fill.brass{background:var(--chart-2)} .bar-fill.warn{background:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-3);font-size:13px}

/* ---------- intro ---------- */
.intro{max-width:1120px;margin:0 auto;padding:48px 16px 64px;display:grid;gap:40px}
.intro-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.intro-hero h1{font-size:clamp(34px,5vw,56px);line-height:1.02;font-weight:700;letter-spacing:-.025em}
.intro-hero p.lede{font-size:17px;color:var(--fg-2);max-width:34em;margin-top:18px}
.intro-hero .who{margin-top:22px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg-3)}
.intro-hero .who b{color:var(--fg);font-weight:600;font-family:var(--f-mono)}
.loop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.loop-cap{display:flex;justify-content:space-between;margin-bottom:10px}
.loop svg{width:100%;height:auto;display:block}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.door{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:24px;display:grid;gap:14px;align-content:start;transition:border-color .15s}
.door:hover{border-color:var(--accent)}
.door .k{display:flex;justify-content:space-between;align-items:center}
.door h2{font-size:24px;font-weight:600}
.door p{color:var(--fg-2);max-width:40em}
.door ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.door li{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg-2)}
.door .go{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px;font-size:14px}
.card-feats{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1px solid var(--line);padding-top:20px}
.card-feats div{padding-right:14px;display:grid;gap:6px;font-size:13px;color:var(--fg-2)}
.card-feats b{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:600;font-family:var(--f-display)}
@media (max-width:900px){ .intro-hero,.doors{grid-template-columns:1fr} .card-feats{grid-template-columns:repeat(3,1fr);row-gap:18px} .intro{padding-top:28px} }
@media (max-width:480px){ .card-feats{grid-template-columns:1fr 1fr} }
</style>
<style>
/* ---------- operator console ---------- */
.op{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 54px)}
.side{border-right:1px solid var(--line);background:var(--surface-2);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.prop{display:grid;gap:2px;padding:4px 8px 14px;border-bottom:1px solid var(--line)}
.prop b{font-family:var(--f-display);font-size:15px}
.prop span{font-size:12px;color:var(--fg-3)}
.navg{display:grid;gap:2px}
.navg .eyebrow{padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px;color:var(--fg-2);font-size:13.5px;width:100%}
.nav:hover{background:var(--sunk);color:var(--fg)}
.nav[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line);font-weight:500}
.nav[aria-current="page"] .ico{color:var(--accent)}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 7px}
.nav .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--fg-3);padding:10px 8px 0;border-top:1px solid var(--line);line-height:1.45}
.main{padding:24px 28px 56px;min-width:0;display:grid;gap:20px;align-content:start;max-width:1440px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{font-size:26px;font-weight:600}
.phead .q{color:var(--fg-2);margin-top:4px;font-size:14px}
.phead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav{display:none}
@media (max-width:980px){
  .op{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:54px;z-index:20;scrollbar-width:none}
  .mnav .nav{width:auto;white-space:nowrap;padding:6px 10px}
  .main{padding:18px 16px 48px}
}

/* headline band */
.band{display:grid;grid-template-columns:1.35fr repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.band > div{padding:18px 20px;border-left:1px solid var(--line);display:grid;gap:4px;align-content:start;min-width:0}
.band > div:first-child{border-left:0}
.band .lab{font-size:12.5px;color:var(--fg-2);font-weight:500;display:flex;align-items:center;gap:6px}
.band .val{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.band .hero .val{font-size:44px}
.band .ctx{font-size:12.5px;color:var(--fg-3)}
.delta{font-family:var(--f-mono);font-size:12px}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.band .split{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.band .split small{font-size:12px;color:var(--fg-3);font-family:var(--f-body)}
@media (max-width:1100px){ .band{grid-template-columns:1fr 1fr} .band > div:nth-child(3){border-left:0} .band > div:nth-child(n+3){border-top:1px solid var(--line)} }
@media (max-width:520px){ .band{grid-template-columns:1fr} .band > div{border-left:0} .band > div + div{border-top:1px solid var(--line)} .band .hero .val{font-size:38px} }

/* ecosystem loop flow */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stage{padding:4px 14px 0 0;display:grid;gap:4px;position:relative}
.stage + .stage{padding-left:14px;border-left:1px dashed var(--line-strong)}
.stage .n{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stage .t{font-size:13px;font-weight:500}
.stage .c{font-size:12px;color:var(--fg-3)}
.stage .conv{position:absolute;left:-13px;top:6px;background:var(--surface);font-family:var(--f-mono);font-size:10.5px;color:var(--accent);padding:1px 3px;border-radius:4px;border:1px solid var(--line);transform:translateX(-50%);left:0}
.stage .meter{height:4px;background:var(--sunk);border-radius:9px;margin-top:6px;overflow:hidden}
.stage .meter i{display:block;height:100%;background:var(--chart-1)}
.stage.stg-pts .meter i{background:var(--chart-2)}
.loopback{margin-top:14px;font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:900px){ .flow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px} .stage:nth-child(4){border-left:0;padding-left:0} }
@media (max-width:520px){ .flow{grid-template-columns:repeat(2,minmax(0,1fr))} .stage:nth-child(3),.stage:nth-child(5){border-left:0;padding-left:0} .stage:nth-child(4){border-left:1px dashed var(--line-strong);padding-left:14px} }

.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}
@media (max-width:1100px){ .g2,.g3{grid-template-columns:1fr} }
@media (max-width:800px){ .g2e{grid-template-columns:1fr} }

/* stat strip (secondary metrics) */
.strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.strip > div{flex:1 1 170px;padding:14px 18px;border-left:1px solid var(--line);display:grid;gap:2px}
.strip > div:first-child{border-left:0}
.strip .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .l{font-size:12.5px;color:var(--fg-2)}
.strip .s{font-size:12px;color:var(--fg-3)}
@media (max-width:700px){ .strip > div{flex-basis:45%;border-left:0;border-top:1px solid var(--line)} .strip > div:nth-child(-n+2){border-top:0} .strip > div:nth-child(even){border-left:1px solid var(--line)} }

/* feed */
.feed{display:grid}
.ev{display:grid;grid-template-columns:62px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:13px}
.ev:first-child{border-top:0}
.ev .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-3)}
.ev .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--fg-2)}
.ev .ic .ico{width:15px;height:15px}
.ev .ic.pay{background:var(--accent-soft);color:var(--accent)}
.ev .ic.pts{background:var(--brass-soft);color:var(--brass)}
.ev .ic.bad{background:var(--bad-soft);color:var(--bad)}
.ev .ic.warn{background:var(--warn-soft);color:var(--warn)}
.ev .ic.ok{background:var(--ok-soft);color:var(--ok)}
.ev .d{min-width:0}
.ev .d b{font-weight:600}
.ev .d .m{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.ev.new{animation:flash 1.6s ease-out}
.ev.mine{box-shadow:inset 3px 0 0 var(--accent)}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){ .ev.new{animation:none} }
@media (max-width:560px){ .ev{grid-template-columns:28px minmax(0,1fr) auto;padding:9px 12px} .ev .tm{display:none} }
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:500}
.livedot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px var(--ok-soft)}
.livedot.paused{color:var(--fg-3)}

/* attention + systems */
.att{display:grid}
.att-i{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:11px 16px 11px 0;border-top:1px solid var(--line);align-items:center}
.att-i:first-child{border-top:0}
.att-i .sv{align-self:stretch;border-radius:0 3px 3px 0;background:var(--warn)}
.att-i.bad .sv{background:var(--bad)} .att-i.info .sv{background:var(--info)}
.att-i b{font-weight:600;font-size:13.5px;display:block}
.att-i span{font-size:12.5px;color:var(--fg-2)}
.att-i.done{opacity:.5}
.sys{display:grid}
.sys-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.sys-i:first-child{border-top:0}
.sys-i b{font-weight:500;font-size:13.5px}
.sys-i small{grid-column:1/-1;font-size:12px;color:var(--fg-3)}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--fg-3);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.t th.r,.t td.r{text-align:right}
.t th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
.t th button[data-dir]{color:var(--fg)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t .who{display:flex;align-items:center;gap:10px}
.t .who b{font-weight:500;display:block}
.t .who small{font-size:12px;color:var(--fg-3)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--sunk);color:var(--fg-2);flex:none;font-family:var(--f-display)}
.tlogo{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;font-family:var(--f-display)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .search{flex:1 1 220px;max-width:320px}
.toolbar .count{margin-left:auto;font-size:12px;color:var(--fg-3)}
@media (max-width:700px){ .hide-sm{display:none} }

/* horizontal bars */
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:14px;background:var(--sunk);border-radius:3px;display:flex;overflow:hidden}
.hb .tr i{display:block;height:100%}
.hb .v{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* charts */
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--fg-3)}
.chart .end{font-family:var(--f-body);font-size:11.5px;fill:var(--fg);font-weight:600}
.chart .tip-line{stroke:var(--line-strong)}
.ctip{position:absolute;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;min-width:150px;z-index:5;display:grid;gap:3px}
.ctip[hidden]{display:none}
.ctip .h{font-weight:600}
.ctip > div:not(.h){display:flex;gap:6px;align-items:center}
.ctip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ctip b{margin-left:auto;padding-left:12px;font-family:var(--f-mono);font-weight:500}

/* campaigns */
.camps{display:grid;gap:14px}
.camp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.camp .ci{padding:16px 18px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line)}
.camp .ci h3{font-size:16px;font-weight:600}
.camp .ci p{font-size:13px;color:var(--fg-2)}
.camp .ci .meta{font-size:12px;color:var(--fg-3);display:flex;gap:10px;flex-wrap:wrap}
.camp .cm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start}
.camp .cm > div{padding:16px 16px;display:grid;gap:2px;border-left:1px solid var(--line)}
.camp .cm > div:first-child{border-left:0}
.camp .cm .v{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.camp .cm .l{font-size:12px;color:var(--fg-3)}
.camp .cb{grid-column:1/-1;border-top:1px solid var(--line);padding:10px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.camp.ended{background:var(--surface-2)}
@media (max-width:900px){ .camp{grid-template-columns:1fr} .camp .ci{border-right:0;border-bottom:1px solid var(--line)} .camp .cm{grid-template-columns:1fr 1fr} .camp .cm > div:nth-child(3){border-left:0} .camp .cm > div:nth-child(n+3){border-top:1px solid var(--line)} }

/* reward list (operator) */
.rlist{display:grid}
.rl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.rl:first-child{border-top:0}
.rl .rk{font-family:var(--f-mono);color:var(--fg-3);font-size:12px}
.rl small{display:block;color:var(--fg-3);font-size:12px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0}
.kv > *{padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.kv > :nth-child(-n+2){border-top:0}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;text-align:right;font-weight:500}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:61;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{overflow:auto;padding:18px 20px 32px;display:grid;gap:18px;align-content:start}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.mini-card{background:var(--card-bg);color:var(--card-fg);border-radius:12px;padding:16px;display:grid;gap:12px}
.mini-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini-card small{color:var(--card-fg-2);font-size:12px}

/* ---------- resident app ---------- */
.res{display:grid;grid-template-columns:minmax(0,430px) minmax(0,380px);justify-content:center;gap:40px;padding:24px 16px 0;min-height:calc(100% - 54px)}
.res.solo{grid-template-columns:minmax(0,430px)}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;height:min(860px,calc(100vh - 78px));min-height:600px}
.mirror{align-self:start;position:sticky;top:78px;display:grid;gap:14px}
.mirror h3{font-size:15px;font-weight:600}
.mirror p{font-size:13px;color:var(--fg-2)}
@media (max-width:900px){
  .res{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .mirror{display:none}
  .phone{border:0;border-radius:0;height:calc(100vh - 54px);height:calc(100dvh - 54px);min-height:0}
}
.scr{flex:1;overflow:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin;min-height:0}
.scr > *{flex-shrink:0}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.appbar h2{font-size:22px;font-weight:600}
.appbar .sub{font-size:13px;color:var(--fg-2)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--fg-3);font-weight:500}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.pay .pb{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-18px;border:4px solid var(--bg)}
.tab.pay{color:var(--fg-2)}

/* the One Card */
.onecard{background:var(--card-bg);color:var(--card-fg);border-radius:18px;padding:18px 18px 16px;display:grid;gap:16px;position:relative;overflow:hidden;isolation:isolate}
.onecard::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;border:1px solid var(--card-line);z-index:-1;box-shadow:0 0 0 30px rgba(255,255,255,.015),0 0 0 60px rgba(255,255,255,.012)}
.onecard .top{display:flex;justify-content:space-between;align-items:center}
.onecard .wm{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:12px;display:flex;align-items:center;gap:8px}
.onecard .st{font-size:12px;display:flex;align-items:center;gap:6px;color:#8FE0B4}
.onecard .st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.onecard .st.frozen{color:#9CC3F2}
.onecard .unit{font-size:13px;color:var(--card-fg-2)}
.onecard .unit b{color:var(--card-fg);font-weight:500}
.onecard .vals{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--card-line);padding-top:12px}
.onecard .vals > button{background:none;border:0;text-align:left;padding:0;color:inherit;display:grid;gap:2px}
.onecard .vals > button + button{border-left:1px solid var(--card-line);padding-left:14px}
.onecard .vals small{font-size:11.5px;color:var(--card-fg-2);letter-spacing:.06em;text-transform:uppercase}
.onecard .vals b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.onecard .vals b.p{color:#E2BE7C}
.onecard .no{font-family:var(--f-mono);font-size:12px;color:var(--card-fg-2);letter-spacing:.1em}
.onecard.frozen{filter:saturate(.3)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:500}
.qa .ico{width:22px;height:22px;color:var(--accent)}
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h3{font-size:16px;font-weight:600}
.sec-h button{border:0;background:none;color:var(--accent);font-size:13px;font-weight:500;padding:0}
.feature{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.feature .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.feature .fi.brass{background:var(--brass-soft);color:var(--brass)}
.feature .fi.warn{background:var(--warn-soft);color:var(--warn)}
.feature b{display:block;font-weight:600;font-size:14px}
.feature span{font-size:12.5px;color:var(--fg-2);display:block}
.feature .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);font-weight:500;margin-bottom:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;overflow:hidden}
.li{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li .lic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--fg-2)}
.li b{font-weight:500;display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{font-size:12.5px;color:var(--fg-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:right;font-size:13.5px;font-family:var(--f-mono);white-space:nowrap}
.li .rt small{font-family:var(--f-body)}
.split-lbl{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.split-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hscroll > *{scroll-snap-align:start}
.offer{border-radius:14px;padding:16px;display:grid;gap:10px;align-content:space-between;min-height:150px;text-align:left;border:1px solid var(--line);background:var(--surface)}
.offer .tag{justify-self:start}
.offer h4{font-size:17px;font-weight:600;line-height:1.2}
.offer p{font-size:12.5px;color:var(--fg-2)}
.offer.dark{background:var(--card-bg);color:var(--card-fg);border-color:var(--card-bg)}
.offer.dark p{color:var(--card-fg-2)}
.mgrid{display:grid;gap:8px}
.merch{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.merch .tlogo{width:48px;height:48px;border-radius:12px;font-size:15px}
.merch b{font-weight:600;display:block}
.merch small{font-size:12.5px;color:var(--fg-3);display:block}
.merch .deal{font-size:12px;color:var(--accent);font-weight:500;margin-top:3px;display:block}
.merch .x{font-size:12px;font-family:var(--f-mono);color:var(--brass);text-align:right}
.event{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.event:first-child{border-top:0}
.event .dt{text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;line-height:1.1}
.event .dt small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--bad);font-weight:600}
.event .dt b{font-family:var(--f-display);font-size:19px}
.event b{font-weight:600}
.event span{font-size:12.5px;color:var(--fg-2);display:block}

.bigbal{display:grid;gap:4px;justify-items:start}
.bigbal .v{font-family:var(--f-display);font-size:42px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.twoacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.note .ico{width:15px;height:15px;margin-top:1px}
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.rw b{font-weight:600}
.rw small{font-size:12.5px;color:var(--fg-3);display:block}
.rw .bar-track{grid-column:1/-1}
.rw .cost{font-family:var(--f-mono);color:var(--brass);font-size:13px;white-space:nowrap}
.access-pass{background:var(--card-bg);color:var(--card-fg);border-radius:18px;padding:22px 18px;display:grid;justify-items:center;gap:10px;text-align:center}
.tapring{margin:26px 0 20px;width:120px;height:120px;border-radius:50%;border:1px solid var(--card-line);display:grid;place-items:center;position:relative;background:none;color:var(--card-fg)}
.tapring::before,.tapring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--card-line);opacity:.6}
.tapring::after{inset:-26px;opacity:.3}
.tapring .ico{width:40px;height:40px;stroke-width:1.4}
.tapring.go{border-color:#8FE0B4;color:#8FE0B4}
.tapring.go::before{border-color:#8FE0B4;animation:ping 1s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){ .tapring.go::before{animation:none} }
.access-pass small{color:var(--card-fg-2);font-size:12.5px}
.doorsel{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.doorsel button{border:1px solid var(--card-line);background:none;color:var(--card-fg-2);border-radius:99px;padding:5px 11px;font-size:12.5px}
.doorsel button[aria-pressed="true"]{background:var(--card-fg);color:var(--card-bg);border-color:var(--card-fg)}
.fac{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fac button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:grid;gap:6px}
.fac button .ico{color:var(--accent)}
.fac b{font-weight:600;font-size:14px}
.fac small{font-size:12px;color:var(--fg-3)}
.fac .bk{font-size:11.5px;color:var(--ok);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-size:13px;font-family:var(--f-mono)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slot:disabled{text-decoration:line-through;color:var(--fg-3);background:var(--sunk);cursor:not-allowed}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;z-index:0}
.sheet{position:relative;z-index:1;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:grid;gap:16px}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line-strong);justify-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h3{font-size:18px;font-weight:600}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line-strong);padding-bottom:6px}
.amt span{font-family:var(--f-display);font-size:24px;color:var(--fg-3)}
.amt input{border:0;background:none;font-family:var(--f-display);font-size:40px;font-weight:600;width:100%;padding:0;font-variant-numeric:tabular-nums}
.amt input:focus{outline:none}
.amt:focus-within{border-color:var(--accent)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:grid}
.summary > div{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.summary > div:first-child{border-top:0}
.summary span{color:var(--fg-2)}
.done{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.done .ok{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done .ok .ico{width:30px;height:30px;stroke-width:2.2}
.done h3{font-size:22px}
.voucher{border:1px dashed var(--brass-line);background:var(--brass-soft);border-radius:12px;padding:14px;font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;color:var(--brass);text-align:center;width:100%}
.mselect{display:grid;gap:6px;max-height:210px;overflow:auto}
.mopt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);text-align:left}
.mopt .tlogo{width:34px;height:34px;font-size:11px;border-radius:8px}
.mopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mopt small{display:block;font-size:12px;color:var(--fg-3)}

/* login */
.login{flex:1;overflow:auto;display:grid;align-content:start;gap:24px;padding:28px 22px 24px}
.login .hero{display:grid;gap:12px}

const activeRes = RESIDENTS.filter(r=>r.status==="Active" && r!==ME);
function makeEvent(t, forced){
  const r = pick(activeRes); const ten = pick(TENANTS);
  const roll = forced || (()=>{ const x=Math.random()*100; return x<34?"pay":x<62?"access":x<74?"points":x<80?"redeem":x<86?"topup":x<90?"booking":x<93?"activate":x<97?"decline":x<99?"suspend":"fault"; })();
  const amt = Math.round((5 + Math.random()*Math.random()*140)*10)/10;
  const e = {t, type:roll, who:r.name, unit:r.unit};
  switch(roll){
    case "pay": Object.assign(e,{title:`<b>${r.name}</b> paid at ${ten.name}`, meta:`${r.unit} · One Card wallet · ${ten.cat}`, right:fS(amt), amt, ten:ten.id, status:"Approved"}); break;
    case "points": { const m = ten.mult && ten.cat==="Dining" ? 3 : 1; const p = Math.round(amt*2*m); Object.assign(e,{title:`<b>+${fN(p)} points</b> to ${r.name}`, meta:`${ten.name} · ${m>1?"Weekend Dining Bonus 3×":"2 points per S$1"}`, right:`<span class="pts">+${fN(p)}</span>`}); break; }
    case "access": { const d = pick(DOORS); e.door=d; Object.assign(e,{title:`<b>${r.name}</b> entered ${d}`, meta:`${r.unit} · tapped One Card`, right:`<span class="faint">Granted</span>`}); break; }
    case "redeem": { const rw = pick(REWARDS); Object.assign(e,{title:`<b>${r.name}</b> redeemed ${rw.name}`, meta:`${r.unit} · ${rw.where}`, right:`<span class="pts">−${fN(rw.cost)}</span>`}); break; }
    case "topup": { const v = pick([20,50,50,100,100,200]); Object.assign(e,{title:`<b>${r.name}</b> topped up wallet`, meta:`${r.unit} · simulated funding source`, right:`+${fS(v)}`, amt:v, status:"Top-up"}); break; }
    case "booking": { const f = pick(["BBQ pavilion","Tennis court","Function room"]); Object.assign(e,{title:`<b>${r.name}</b> booked ${f}`, meta:`${r.unit} · ${pick(["Sat 3 Oct","Sun 4 Oct","Fri 2 Oct"])} · ${pick(["10:00","18:00","19:00"])}`, right:`<span class="faint">Confirmed</span>`}); break; }
    case "activate": { const nr = pick(RESIDENTS.filter(x=>x.status==="Pending")) || r; Object.assign(e,{who:nr.name, unit:nr.unit, title:`<b>${nr.name}</b> activated One Card`, meta:`${nr.unit} · New Resident Welcome applied`, right:`<span class="pill ok plain">New</span>`}); break; }
    case "decline": Object.assign(e,{title:`Payment declined at ${ten.name}`, meta:`${r.name} · ${pick(["insufficient wallet balance","terminal timeout","card frozen by resident"])}`, right:`<span style="color:var(--bad)">${fS(amt)}</span>`, amt, ten:ten.id, status:"Declined"}); break;
    case "suspend": Object.assign(e,{title:`Card temporarily suspended`, meta:`${r.name} · ${r.unit} · frozen from resident app`, right:`<span class="pill warn plain">Suspended</span>`}); break;
    case "fault": Object.assign(e,{title:`Carpark B2 exit reader not responding`, meta:`Exit routed to intercom · ticket open`, right:`<span class="pill bad plain">Fault</span>`}); break;
  }
  return e;
}
// seed ~70 minutes of history
(function seed(){
  let t = now().getTime() - 70*60*1000;
  const list = [];
  while (t < now().getTime()-5000){ t += 25000 + Math.random()*55000; list.push(makeEvent(new Date(t))); }
  // ensure a couple of exceptions are present
  list.splice(list.length-6, 0, makeEvent(new Date(now().getTime()-9*60000), "decline"));
  list.splice(list.length-14, 0, makeEvent(new Date(now().getTime()-31*60000), "fault"));
  list.sort((a,b)=>b.t-a.t); S.feed = list;
  // ledger seed
  const L = []; let lt = now().getTime();
  for (let i=0;i<46;i++){ lt -= 60000*(3+Math.random()*14); const x=Math.random(); L.push(makeEvent(new Date(lt), x<.82?"pay":x<.94?"topup":"decline")); }
  L.splice(5,0,Object.assign(makeEvent(new Date(now().getTime()-40*60000),"pay"),{status:"Refunded"}));
  S.ledger = L.map((e,i)=>({...e, ref:"TXN-"+(884120-i*7)}));
})();

function pushEvent(e){
  S.feed.unshift(e); if (S.feed.length>240) S.feed.pop();
  if (["pay","topup","decline"].includes(e.type)) { S.ledger.unshift({...e, ref:"TXN-"+(884121+Math.floor(Math.random()*900))}); if (S.ledger.length>120) S.ledger.pop(); }
  onFeed(e);
}
function tick(){
  if (!S.paused) pushEvent(makeEvent(now()));
  setTimeout(tick, 2400 + Math.random()*2600);
}
/* resident-app events flow into the same feed */
function emitMine(type, extra){
  const e = Object.assign({t:now(), type, who:ME.name, unit:ME.unit, mine:true}, extra);
  pushEvent(e);
}

/* ================= charts ================= */
function niceMax(v){ if (v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const CHARTS = {}; let chartId = 0;
function chart(spec){ const id = "ch"+(++chartId); CHARTS[id] = spec; return `<div class="chart" id="${id}" style="position:relative;height:${spec.h||200}px"></div>`; }
function drawCharts(){ for (const id in CHARTS){ const el = document.getElementById(id); if (!el){ delete CHARTS[id]; continue; } const s = CHARTS[id]; (s.type==="line"?drawLine:drawCols)(el, s); } }
function axis(W,H,pd,max,fmt){
  let g = ""; for (let i=0;i<=4;i++){ const v = max*i/4; const y = pd.t + (H-pd.t-pd.b)*(1-i/4);
    g += `<line x1="${pd.l}" x2="${W-pd.r}" y1="${y}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/><text x="${pd.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`; }
  return g;
}
function xlabels(labels, xf, H, pd, every){ const n = labels.length; return labels.map((l,i)=> (i===n-1 || (i%every===0 && n-1-i >= every*0.6)) ? `<text x="${xf(i)}" y="${H-6}" text-anchor="middle">${l}</text>` : "").join(""); }
function drawLine(el, s){
  const W = Math.max(280, el.clientWidth), H = s.h||200, pd = {l:44, r:s.endLabel===false?12:58, t:14, b:24};
  const all = s.series.flatMap(x=>x.values.filter(v=>v!=null)); const max = niceMax(Math.max(...all)*1.05);
  const n = s.labels.length; const xf = i => pd.l + i*(W-pd.l-pd.r)/(n-1); const yf = v => pd.t + (H-pd.t-pd.b)*(1-v/max);
  const fmt = s.fmt || fK; let g = axis(W,H,pd,max,fmt);
  const every = Math.ceil(n / Math.max(3, Math.floor((W-pd.l-pd.r)/64)));
  g += xlabels(s.labels, xf, H, pd, every);
  s.series.forEach((ser,si)=>{
    const pts = ser.values.map((v,i)=>[xf(i),yf(v)]);
    const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    if (si===0 && s.area!==false) g += `<path d="${d} L${xf(n-1)} ${yf(0)} L${xf(0)} ${yf(0)} Z" style="fill:${ser.color};opacity:.1"/>`;
    g += `<path d="${d}" fill="none" style="stroke:${ser.color}" stroke-width="${si===0?2:1.6}" ${ser.dash?'stroke-dasharray="4 4"':""} stroke-linejoin="round"/>`;
    const last = pts[n-1];
    g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" style="fill:${ser.color};stroke:var(--surface)" stroke-width="2"/>`;
    if (s.endLabel!==false) g += `<text class="end" x="${last[0]+8}" y="${last[1]+4}">${(s.endFmt||fmt)(ser.values[n-1])}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="tip-line" x1="0" x2="0" y1="${pd.t}" y2="${H-pd.b}" stroke-width="1" style="display:none"/></svg><div class="ctip" hidden></div>`;
  hover(el, s, xf, pd, W, n);
}
function drawCols(el, s){
  const W = Math.max(280, el.clientWidth), H = s.h||200, pd = {l:44, r:12, t:14, b:24};
  const n = s.labels.length; const stacked = s.mode!=="group";
  const tot = i => stacked ? s.series.reduce((a,x)=>a+(x.values[i]||0),0) : Math.max(...s.series.map(x=>x.values[i]||0));
  const max = niceMax(Math.max(...s.labels.map((_,i)=>Math.max(tot(i), s.ghost?(s.ghost[i]||0):0)))*1.05);
  const band = (W-pd.l-pd.r)/n; const bw = Math.min(34, band*0.62); const xf = i => pd.l + band*i + band/2;
  const yf = v => pd.t + (H-pd.t-pd.b)*(1-v/max); const fmt = s.fmt || fK;
  let g = axis(W,H,pd,max,fmt);
  const every = Math.ceil(n / Math.max(3, Math.floor((W-pd.l-pd.r)/48)));
  g += xlabels(s.labels, xf, H, pd, every);
  for (let i=0;i<n;i++){
    if (s.ghost && s.series.every(x=>x.values[i]==null)){ const v=s.ghost[i]; g += `<rect x="${xf(i)-bw/2}" y="${yf(v)}" width="${bw}" height="${yf(0)-yf(v)}" rx="2" style="fill:none;stroke:var(--line-strong)" stroke-dasharray="3 3"/>`; continue; }
    if (stacked){ let acc=0; s.series.forEach((ser)=>{ const v=ser.values[i]||0; if(!v) return; const y0=yf(acc), y1=yf(acc+v); g += `<rect x="${xf(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-1)}" style="fill:${ser.color}"/>`; acc+=v; }); }
    else { const k=s.series.length, w=bw/k; s.series.forEach((ser,si)=>{ const v=ser.values[i]||0; g += `<rect x="${xf(i)-bw/2+si*w}" y="${yf(v)}" width="${w-1.5}" height="${yf(0)-yf(v)}" style="fill:${ser.color}"/>`; }); }
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="tip-line" x1="0" x2="0" y1="${pd.t}" y2="${H-pd.b}" stroke-width="1" style="display:none"/></svg><div class="ctip" hidden></div>`;
  hover(el, s, xf, pd, W, n);
}
function hover(el, s, xf, pd, W, n){
  const svg = el.querySelector("svg"), tip = el.querySelector(".ctip"), ln = el.querySelector(".tip-line");
  const fmt = s.tipFmt || s.fmt || fN;
  el.onpointermove = ev => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
    let i = 0, best = 1e9; for (let k=0;k<n;k++){ const d=Math.abs(xf(k)-x); if (d<best){best=d;i=k;} }
    const rows = s.series.filter(x=>x.values[i]!=null).map(x=>`<div><i style="background:${x.color}"></i>${x.name}<b>${fmt(x.values[i])}</b></div>`).join("") || (s.ghost?`<div>${s.ghostName||"Comparison"}<b>${fmt(s.ghost[i])}</b></div>`:"");
    tip.innerHTML = `<div class="h">${s.tipLabels?s.tipLabels[i]:s.labels[i]}</div>${rows}`; tip.hidden = false;
    ln.setAttribute("x1", xf(i)); ln.setAttribute("x2", xf(i)); ln.style.display = "";
    const px = xf(i) * r.width / W; tip.style.left = Math.min(Math.max(0, px + 12), r.width - tip.offsetWidth) + "px"; tip.style.top = "4px";
    if (px + 12 + tip.offsetWidth > r.width) tip.style.left = Math.max(0, px - tip.offsetWidth - 12) + "px";
  };
  el.onpointerleave = () => { tip.hidden = true; ln.style.display = "none"; };
}
function spark(vals, w=84, h=24, color="var(--chart-1)"){
  const mx=Math.max(...vals), mn=Math.min(...vals); const xf=i=>i*(w-4)/(vals.length-1)+2, yf=v=>h-3-(v-mn)/(mx-mn||1)*(h-6);
  const d = vals.map((v,i)=>(i?"L":"M")+xf(i).toFixed(1)+" "+yf(v).toFixed(1)).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${color}" stroke-width="1.5"/><circle cx="${xf(vals.length-1)}" cy="${yf(vals[vals.length-1])}" r="2.2" style="fill:${color}"/></svg>`;
}

}
function onFeed(e){
  const box = $("#feedlist");
  if (box){ const lim = +box.dataset.limit; const f = S.feedFilter; const ok = box.dataset.all ? true : (f==="all" || (f==="exceptions"?EV_META[e.type].exc:EV_META[e.type].grp===f));
    if (ok || box.dataset.all){ box.insertAdjacentHTML("afterbegin", evRow(e,true)); while (box.children.length>lim) box.lastElementChild.remove(); } }

}

/* ---- Live ---- */
function liveCounts(){
  const hr = now().getTime()-3600000; const c = {all:0,payments:0,access:0,rewards:0,cards:0,exceptions:0};
  S.feed.forEach(e=>{ if (e.t.getTime()<hr) return; c.all++; c[EV_META[e.type].grp]++; if (EV_META[e.type].exc) c.exceptions++; }); return c;
}
function pLive(){
  const c = liveCounts();

      <div class="summary"><div><span>Funding source</span><b>Demo bank account</b></div><div><span>Balance after top-up</span><b class="num">${fS(ME.wallet+s.amt)}</b></div></div>

      <button class="btn primary lg block" data-act="payhere" data-id="${t.id}" ${A.frozen?"disabled":""}>Pay at ${t.name}</button>`;

    else body = h("Redeem reward") + `<div><h3 style="font-size:20px">${r.name}</h3><p class="muted" style="margin-top:4px">${r.where}</p></div><div class="summary"><div><span>Cost</span><b class="pts">${fN(r.cost)} points</b></div><div><span>Points after</span><b class="num">${fN(ME.points-r.cost)}</b></div><div><span>Valid for</span><b>30 days</b></div></div><button class="btn primary lg block" data-act="doredeem" data-id="${r.id}">Redeem for ${fN(r.cost)} points</button>`;

    const f = FACILITIES.find(x=>x.id===s.id); const days = nextDays(); const taken = new Set([(s.day*7+1)%6, (s.day*3+4)%6]);

    body = h("Notifications") + `<div class="list">${[["parcel","Parcel at concierge","Tower B lobby · arrived 11:40 · collect by Thu","warn"],["star","+14 points from Kopi Harbour","Today 08:12","brass"],["alert","Pool maintenance on Thursday","9am – 12pm · pool deck closed","info"]].map(n=>`<div class="li"><span class="lic" style="background:var(--${n[3]}-soft);color:var(--${n[3]})">${ico(n[0])}</span><div><b>${n[1]}</b><small>${n[2]}</small></div><span></span></div>`).join("")}</div>`;
  } else if (s.kind==="paycode"){
    const r = rng(2604); let cells=""; for (let y=0;y<21;y++) for (let x=0;x<21;x++){ const fin = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13); const on = fin ? ((x%14===0||x%14===6||y%14===0||y%14===6)||((x%14>=2&&x%14<=4)&&(y%14>=2&&y%14<=4))) : r()>.5; if(on) cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }

  }
  return `<div class="sheet-wrap"><div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function paySummary(){
  const s = A.sheet; const amt = parseFloat(s.amt); const valid = amt>0 && isFinite(amt); const over = valid && amt>ME.wallet;
  const e = valid ? earnFor(s.m, amt) : {pts:0, why:""};
  return `<div class="summary"><div><span>You'll earn</span><b class="pts">${valid?"+"+fN(e.pts)+" points":"—"}</b></div>${valid?`<div><span style="font-size:12.5px">${e.why}</span></div>`:""}<div><span>Wallet after</span><b class="num" ${over?'style="color:var(--bad)"':""}>${valid?fS(ME.wallet-amt):fS(ME.wallet)}</b></div></div>
  ${over?`<p style="color:var(--bad);font-size:13px;margin-top:10px">That's more than your balance of ${fS(ME.wallet)}. Top up or enter a smaller amount.</p>`:""}
  <button class="btn primary lg block" style="margin-top:14px" data-act="dopay" ${valid&&!over&&s.m?"":"disabled"}>${valid?"Pay "+fS(amt):"Enter an amount"}</button>`;
}

const H = {
  go(el){ S.view = el.dataset.v; S.drawer=null; setHash(); render(); window.scrollTo(0,0); },
  theme(){ document.documentElement.dataset.theme = isDark() ? "light" : "dark"; render(); },
  op(el){ S.op = el.dataset.p; S.drawer=null; setHash(); render(); $("#opmain") && window.scrollTo(0,0); },
  period(el){ S.period = el.dataset.k; render(); },
  pause(){ S.paused = !S.paused; render(); },
  ffilter(el){ S.feedFilter = el.dataset.k; render(); },
  handle(el){ const a = S.attention.find(x=>x.id===el.dataset.id); a.done = true; toast(a.a + " · marked as handled (simulated)"); render(); },
  toast(el){ toast(el.dataset.m); },
  rfilter(el){ S.resFilter = el.dataset.k; render(); },
  resident(el){ S.drawer = el.dataset.id; render(); },
  close(){ S.drawer = null; render(); },
  suspend(el){ const r = RESIDENTS.find(x=>x.id===el.dataset.id); r.status="Suspended"; if (r===ME) A.frozen = true; pushEvent({t:now(), type:"suspend", who:r.name, unit:r.unit, title:"Card temporarily suspended", meta:`${r.name} · ${r.unit} · by centre management`, right:`<span class="pill warn plain">Suspended</span>`}); toast(`${r.first}'s card suspended · simulated`); render(); },
  reinstate(el){ const r = RESIDENTS.find(x=>x.id===el.dataset.id); r.status="Active"; if (r===ME) A.frozen=false; toast(`${r.first}'s card reinstated · simulated`); render(); },
  tsort(el){ const k = el.dataset.k; S.tenSort = [k, S.tenSort[0]===k ? -S.tenSort[1] : (["name","cat"].includes(k)?1:-1)]; $("#ttable").innerHTML = tenTable(); },
  tcat(el){ S.tenCat = el.dataset.k; render(); },
  lfilter(el){ S.ledFilter = el.dataset.k; render(); },
  cfilter(el){ S.campFilter = el.dataset.k; render(); },
  // resident
  activate(){ toast("Activation is simulated here. Signing you in as the sample resident."); login(); },
  tab(el){ A.tab = el.dataset.k; A.sheet = null; setHash(); rerenderApp(false); },
  sheet(el){ const k = el.dataset.k;
    if (k==="pay") A.sheet = {kind:"pay", m:"kopi", amt:"", step:"form"};
    else if (k==="topup") A.sheet = {kind:"topup", amt:50};
    else if (k==="book") A.sheet = {kind:"book", id:el.dataset.id, day:0, slot:null};
    else A.sheet = {kind:k, id:el.dataset.id};
    if (k==="pay" && A.frozen){ A.sheet=null; toast("Your card is frozen. Unfreeze it in Residence to pay."); }
    rerenderApp(); },
  closesheet(){ A.sheet = null; rerenderApp(); },
  pickm(el){ A.sheet.m = el.dataset.id; const v = $("#payamt")?.value; if (v!=null) A.sheet.amt = v; rerenderApp(); },
  preset(el){ A.sheet.amt = el.dataset.v; rerenderApp(); },
  payhere(el){ A.sheet = {kind:"pay", m:el.dataset.id, amt:"", step:"form"}; rerenderApp(); setTimeout(()=>$("#payamt")?.focus(),30); },
  dopay(){ const s = A.sheet; const amt = Math.round(parseFloat(s.amt)*100)/100; const t = TEN[s.m]; const e = earnFor(s.m, amt);
    ME.wallet = Math.round((ME.wallet-amt)*100)/100; ME.points += e.pts; ME.spend += amt; ME.visits++; myEarnedExtra += e.pts; t.visits++; t.earned += e.pts; t.txn++; t.sales += amt;
    ME.last = "Paid at "+t.name; ME.lastWhen = "Just now";
    myTx.unshift({m:s.m, amt:-amt, pts:e.pts, when:"Today", time:hhmm(now()), note:e.why.startsWith("2 points")?"":e.why.replace(" (demo: applied today)","")});
    emitMine("pay", {title:`<b>${ME.name}</b> paid at ${t.name}`, meta:`${ME.unit} · One Card wallet · ${t.cat}`, right:fS(amt), amt, ten:t.id, status:"Approved"});
    setTimeout(()=>emitMine("points", {title:`<b>+${fN(e.pts)} points</b> to ${ME.name}`, meta:`${t.name} · ${e.why.replace(" (demo: applied today)","")}`, right:`<span class="pts">+${fN(e.pts)}</span>`}), 700);
    Object.assign(s, {step:"done", paid:amt, earned:e.pts}); rerenderApp(); },
  topamt(el){ A.sheet.amt = +el.dataset.v; rerenderApp(); },
  dotopup(){ const v = A.sheet.amt; ME.wallet += v; myTx.unshift({topup:true, amt:v, when:"Today", time:hhmm(now())});
    emitMine("topup", {title:`<b>${ME.name}</b> topped up wallet`, meta:`${ME.unit} · simulated funding source`, right:"+"+fS(v), amt:v, status:"Top-up"}); A.sheet.step = "done"; rerenderApp(); },
  doredeem(el){ const r = REWARDS.find(x=>x.id===el.dataset.id); ME.points -= r.cost; r.redeemed++; const code = "LSQ-" + Math.random().toString(36).slice(2,5).toUpperCase() + "-" + Math.random().toString(36).slice(2,5).toUpperCase();
    A.redeemed.unshift({name:r.name, when:"today", code}); myTx.unshift({redeem:true, name:r.name, pts:r.cost, when:"Today", time:hhmm(now())});
    emitMine("redeem", {title:`<b>${ME.name}</b> redeemed ${r.name}`, meta:`${ME.unit} · ${r.where}`, right:`<span class="pts">−${fN(r.cost)}</span>`}); Object.assign(A.sheet,{step:"done", code}); rerenderApp(); },
  bday(el){ A.sheet.day = +el.dataset.v; A.sheet.slot = null; rerenderApp(); },
  bslot(el){ A.sheet.slot = el.dataset.v; rerenderApp(); },
  dobook(){ const s = A.sheet; const f = FACILITIES.find(x=>x.id===s.id); const d = nextDays()[s.day]; const when = `${d.label} · ${s.slot}`;
    A.bookings.unshift({fac:f.name, when}); emitMine("booking", {title:`<b>${ME.name}</b> booked ${f.name}`, meta:`${ME.unit} · ${when}`, right:`<span class="faint">Confirmed</span>`}); Object.assign(s,{step:"done", when}); rerenderApp(); },
  door(el){ A.door = el.dataset.k; A.tapping=false; rerenderApp(); },
  tap(){ if (A.frozen){ toast("Your card is frozen. Unfreeze it below to open doors."); return; } if (A.tapping) return;
    A.tapping = true; rerenderApp(); emitMine("access", {title:`<b>${ME.name}</b> entered ${A.door}`, meta:`${ME.unit} · tapped One Card in app`, right:`<span class="faint">Granted</span>`});
    setTimeout(()=>{ A.tapping=false; if (S.view==="resident" && A.tab==="residence") rerenderApp(); }, 2600); },
  freeze(){ A.frozen = !A.frozen; ME.status = A.frozen ? "Suspended" : "Active";
    emitMine(A.frozen?"suspend":"activate", A.frozen ? {title:"Card temporarily suspended", meta:`${ME.name} · ${ME.unit} · frozen from resident app`, right:`<span class="pill warn plain">Suspended</span>`} : {title:`<b>${ME.name}</b> unfroze One Card`, meta:`${ME.unit} · from resident app`, right:`<span class="pill ok plain">Active</span>`});
    toast(A.frozen ? "Card frozen. Doors and payments are paused." : "Card unfrozen."); rerenderApp(); },
  logout(){ A.logged = false; A.sheet=null; A.tab="home"; rerenderApp(false); },
  ncat(el){ A.cat = el.dataset.k; rerenderApp(); },
};
function login(){
  const id = ($("#lg-id")?.value || "").trim();
  const um = id.toUpperCase().replace(/\s/g,"").match(/^#?([ABC])[-\s]?(\d{1,2})[-\s](\d{1,2})$/);
  if (um){ ME.tower = um[1]; ME.unit = `${um[1]}-${pad2(um[2])}-${pad2(um[3])}`; }
  else if (id.includes("@") && id.toLowerCase()!=="meilin.tan@example.com"){ const n = id.split("@")[0].split(/[._-]/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()); if (n.length){ ME.first = n[0]; ME.name = n.join(" "); ME.email = id; } }
  A.logged = true; A.tab = "home"; setHash(); rerenderApp(false);
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = H[el.dataset.act]; if (f){ e.preventDefault(); f(el, e); }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape"){ if (A.sheet){ A.sheet=null; rerenderApp(); } else if (S.drawer){ S.drawer=null; render(); } }
  if (e.key==="Enter" && e.target.matches("tr[data-act]")) e.target.click();
});
document.addEventListener("submit", e => { if (e.target.id==="loginform"){ e.preventDefault(); login(); } });
document.addEventListener("input", e => {
  const k = e.target.dataset.input; if (!k) return; const v = e.target.value;
  if (k==="resq"){ S.resQuery = v; $("#rtable").innerHTML = resTable(); }
  else if (k==="tenq"){ S.tenQuery = v; $("#ttable").innerHTML = tenTable(); }
  else if (k==="payamt"){ A.sheet.amt = v.replace(/[^\d.]/g,""); $("#paysum").innerHTML = paySummary(); }
  else if (k==="nearq"){ A.q = v; const pos = e.target.selectionStart; rerenderApp(); const i = $("#nq"); if (i){ i.focus(); i.setSelectionRange(pos,pos); } }
});
window.addEventListener("hashchange", ()=>{ readHash(); render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if (!document.documentElement.dataset.theme) render(); });

readHash(); render(); setTimeout(tick, 2000);
</script>
</body>
</html>
